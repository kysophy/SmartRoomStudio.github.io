<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Room Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l12 7v12l-12 7-12-7V10z' fill='%232f6fde'/%3E%3Cpath d='M16 3l12 7-12 7-12-7z' fill='%2389b0f5'/%3E%3Cpath d='M16 17v12l12-7V10z' fill='%231f4fa8'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #e7eaef;
  --panel: #f6f7f9;
  --panel2: #ffffff;
  --line: #d9dde4;
  --line2: #e8ebf0;
  --text: #1f2430;
  --muted: #6b7381;
  --faint: #9aa1ad;
  --acc: #2f6fde;
  --acc2: #e8effc;
  --acc3: #c9dafa;
  --ok: #18a058;
  --warn: #d9822b;
  --danger: #d64545;
  --r: 6px;
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.35 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .42; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 1px solid #c9ced6; border-bottom-width: 2px; border-radius: 4px; background: #fff; font: 600 11px/17px var(--font); text-align: center; color: #333; }
code { background: #eef1f5; border-radius: 4px; padding: 0 4px; font-size: 12px; }

#app { display: flex; flex-direction: column; height: 100vh; min-width: 760px; }

/* ---------- top bar ---------- */
#top { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; background: #fff; border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--line2); white-space: nowrap; }
.brand b { font-size: 14px; letter-spacing: .1px; }
.menus { display: flex; gap: 1px; }
.mbtn { border: 0; background: none; padding: 5px 10px; border-radius: 5px; }
.mbtn:hover, .mbtn.open { background: #eef1f5; }
.projbox { display: flex; align-items: center; gap: 8px; margin-left: 8px; min-width: 0; }
.projname { width: 230px; max-width: 30vw; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 8px; font-weight: 600; text-overflow: ellipsis; }
.projname:hover { border-color: var(--line); }
.projname:focus { border-color: var(--acc); background: #fff; outline: none; }
.dirty { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.dirty.on { color: var(--warn); }
.dirty.on::before { content: '● '; }
.spacer { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
.tbtn:hover { background: #f3f5f8; }
.tbtn.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
.tbtn.primary:hover { background: #275fc2; }
.tsep { width: 1px; height: 22px; background: var(--line2); margin: 0 2px; }

/* ---------- ribbon ---------- */
#ribbon { display: flex; align-items: stretch; gap: 0; height: 84px; padding: 4px 6px 0; background: #fbfbfc; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rg { display: flex; flex-direction: column; padding: 0 8px; border-right: 1px solid var(--line2); flex: none; }
.rgb { display: flex; align-items: center; gap: 2px; flex: 1; }
.rgl { text-align: center; font-size: 11px; color: var(--faint); padding: 1px 0 3px; white-space: nowrap; }
.rspacer { flex: 1; }
.rb { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 7px; white-space: nowrap; color: #2a3140; }
.rb:hover:not(:disabled) { background: #eef1f5; border-color: var(--line2); }
.rb.on { background: var(--acc2); border-color: var(--acc3); color: var(--acc); }
.rb.big { flex-direction: column; justify-content: center; gap: 3px; min-width: 58px; height: 58px; padding: 4px 6px; font-size: 11.5px; }
.rb.big svg { flex: none; }
.rb.lab { height: 25px; font-size: 12px; justify-content: flex-start; }
.rb.accent { color: var(--acc); }
.rb.accent:hover { background: var(--acc2); }
.rgrid { display: grid; grid-template-columns: repeat(3, auto); grid-auto-rows: 26px; gap: 1px 2px; align-content: center; }
.rgrid.c2 { grid-template-columns: repeat(2, auto); }
.rgrid.c3 { grid-template-columns: repeat(3, 30px); }
.rgrid.c3 .rb { justify-content: center; padding: 3px; height: 26px; }
.zoomctl { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; margin-left: 6px; }
.zoomctl .rb { padding: 2px 5px; height: 22px; }
.zpct { border: 1px solid var(--line); background: #fff; border-radius: 5px; width: 54px; height: 22px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.zoomctl { flex-direction: row; }

/* ---------- main layout ---------- */
#main { flex: 1; display: flex; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel2); }
.ph { flex: none; height: 30px; display: flex; align-items: center; padding: 0 10px; font-weight: 600; font-size: 12px; color: #3a4252; background: var(--panel); border-bottom: 1px solid var(--line); letter-spacing: .2px; }
.pbody { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; }
#left { width: 252px; flex: none; border-right: 1px solid var(--line); }
#right { width: 312px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel2); min-height: 0; }
#explorerPanel { flex: 0 0 36%; }
#propsPanel { flex: 1; }
.split { flex: none; height: 5px; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: row-resize; }
.split:hover, .split.drag { background: var(--acc3); }
#center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- page tabs ---------- */
#pagebar { flex: none; display: flex; align-items: stretch; height: 34px; background: var(--panel); border-bottom: 1px solid var(--line); }
#pages { display: flex; align-items: stretch; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; min-width: 0; }
#pages::-webkit-scrollbar { display: none; }
.pgrow { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-right: 1px solid var(--line2); color: var(--muted); cursor: pointer; white-space: nowrap; max-width: 260px; user-select: none; border-top: 2px solid transparent; }
.pgrow:hover { background: #eef1f5; color: var(--text); }
.pgrow.on { background: #fff; color: var(--text); border-top-color: var(--acc); font-weight: 600; }
.pgrow .pname { overflow: hidden; text-overflow: ellipsis; }
.pgrow .pk { font-size: 10px; font-weight: 700; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.pgrow.on .pk { color: var(--acc); border-color: var(--acc3); }
.pgrow .rename { width: 170px; }
.pbtn { flex: none; width: 34px; border: 0; border-left: 1px solid var(--line2); background: none; font-size: 17px; color: var(--muted); }
.pbtn:hover { background: #eef1f5; color: var(--text); }
.pbtn.open { background: #eef1f5; }

/* ---------- stage ---------- */
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#canvas[data-tool="wire"] { cursor: crosshair; }
#canvas[data-tool="pan"] { cursor: grab; }
#ab { filter: drop-shadow(0 1px 2px rgba(20, 30, 50, .12)) drop-shadow(0 6px 18px rgba(20, 30, 50, .10)); }
#abs { stroke: #cfd5de; }
#axisGizmo { position: absolute; left: 12px; bottom: 12px; pointer-events: none; }
#emptyHint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; text-align: center; color: #7d8594; font-size: 13.5px; line-height: 1.6; max-width: 440px; }
#emptyHint div { background: rgba(255, 255, 255, .86); border: 1px dashed #c3cad5; border-radius: 10px; padding: 16px 22px; }
textarea.inedit { position: absolute; z-index: 5; resize: none; padding: 4px 6px; border: 2px solid var(--acc); border-radius: 4px; background: #fff; box-shadow: 0 6px 22px rgba(0, 0, 0, .18); outline: none; line-height: 1.3; }

/* ---------- status bar ---------- */
#status { flex: none; display: flex; align-items: center; gap: 16px; height: 25px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
#stMsg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status .sp { flex: 1; }
#stCoord, #stSize { font-variant-numeric: tabular-nums; }
#stSel { color: var(--acc); font-weight: 600; }

/* ---------- toolbox ---------- */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line2); background: #fff; position: sticky; top: 0; z-index: 2; }
.tab { flex: 1; border: 1px solid transparent; border-bottom: 0; background: none; padding: 6px 8px; border-radius: 6px 6px 0 0; color: var(--muted); font-weight: 600; }
.tab:hover { color: var(--text); background: #f3f5f8; }
.tab.on { color: var(--acc); background: #fff; border-color: var(--line2); margin-bottom: -1px; border-bottom: 1px solid #fff; }
.lgh { padding: 12px 10px 5px; font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; }
.lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 8px 4px; }
.litem { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 1px solid var(--line2); background: #fff; border-radius: 7px; padding: 6px 4px 5px; min-height: 76px; text-align: center; }
.litem:hover { border-color: var(--acc3); background: #f7faff; box-shadow: 0 1px 4px rgba(47, 111, 222, .12); }
.litem:active { transform: translateY(1px); }
.lthumb { display: flex; align-items: center; justify-content: center; width: 54px; height: 42px; }
.lthumb svg { overflow: visible; }
.ln { font-size: 11.5px; line-height: 1.2; color: #333b48; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- explorer ---------- */
.lhead { padding: 9px 10px 4px; font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; }
.lempty { padding: 2px 12px 8px; color: var(--faint); font-size: 12px; font-style: italic; }
.lrow { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; cursor: default; border-left: 2px solid transparent; }
.lrow:hover { background: #f3f5f8; }
.lrow.on { background: var(--acc2); border-left-color: var(--acc); }
.lrow.hid .lname, .lrow.hid .lic { opacity: .45; }
.lic { display: inline-flex; color: var(--muted); flex: none; }
.lname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 30px; }
.lname:has(+ .lsub) { flex: none; max-width: 48%; }
.lsub { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faint); font-size: 11px; }
.lrow .lname + .lb, .lrow .gtag + .lb { margin-left: auto; }
.wsw { flex: none; width: 4px; height: 15px; border-radius: 2px; margin-left: -6px; }
.gtag { font-size: 9.5px; font-weight: 700; color: #8a5cc2; border: 1px solid #d9c9ef; border-radius: 3px; padding: 0 3px; flex: none; }
.lb { flex: none; border: 0; background: none; padding: 2px; border-radius: 4px; color: var(--faint); display: inline-flex; opacity: 0; }
.lrow:hover .lb, .lrow.hid .lb, .lrow.lk .lb { opacity: 1; }
.lb:hover { background: #e3e7ee; color: var(--text); }
.rename { border: 1px solid var(--acc); border-radius: 4px; padding: 1px 4px; min-width: 0; flex: 1; }

/* ---------- properties ---------- */
.phead { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 6px; flex-wrap: wrap; }
.pkind { font-size: 10px; font-weight: 700; color: #fff; background: var(--acc); border-radius: 4px; padding: 1px 5px; align-self: center; }
.phead b { font-size: 13.5px; }
.psub { color: var(--faint); font-size: 12px; }
.sec { border-top: 1px solid var(--line2); }
.sec > summary { list-style: none; cursor: pointer; padding: 8px 12px; font-weight: 700; font-size: 12px; color: #3a4252; display: flex; align-items: center; gap: 6px; user-select: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; margin: 0 2px 0 1px; }
.sec[open] > summary::before { transform: rotate(45deg); }
.sec > summary:hover { background: #f6f7f9; }
.secb { padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 8px; min-width: 0; }
.row.nolabel { grid-template-columns: 1fr; }
.rl { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc { min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rc > * { min-width: 0; }
.num, .txt, .sel, .hex, .area { height: 26px; border: 1px solid #d3d8e0; border-radius: 5px; background: #fff; padding: 0 7px; font-size: 12.5px; }
.num:focus, .txt:focus, .sel:focus, .hex:focus, .area:focus { border-color: var(--acc); outline: none; box-shadow: 0 0 0 2px var(--acc2); }
.num { width: 100%; min-width: 46px; font-variant-numeric: tabular-nums; }
.num:disabled { background: #f3f4f6; color: var(--faint); }
.txt, .sel { width: 100%; }
.area { width: 100%; height: auto; min-height: 52px; padding: 5px 7px; resize: vertical; line-height: 1.35; font-family: inherit; }
.pair { display: flex; align-items: center; gap: 6px; width: 100%; }
.pair > * { flex: 1; min-width: 0; }
.pair > .chk { flex: none; }
.xx { flex: none !important; color: var(--faint); }
.xyz { display: grid; grid-template-columns: 12px 1fr 12px 1fr 12px 1fr; align-items: center; gap: 3px; width: 100%; }
.axl { font-size: 10.5px; font-weight: 700; text-align: center; }
.ax0 { color: #e5484d; } .ax1 { color: #2f9e5b; } .ax2 { color: #3e63dd; }
.xyz .num { min-width: 0; padding: 0 4px; -moz-appearance: textfield; }
.xyz .num::-webkit-inner-spin-button, .xyz .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#props > .row { padding: 0 12px 8px; }
.rangew { display: grid; grid-template-columns: 1fr 64px; gap: 8px; align-items: center; width: 100%; }
.rng { width: 100%; accent-color: var(--acc); }
.colorw { width: 100%; display: flex; flex-direction: column; gap: 5px; }
.ctop { display: flex; align-items: center; gap: 6px; }
.csw { width: 30px; height: 26px; padding: 0; border: 1px solid #d3d8e0; border-radius: 5px; background: #fff; cursor: pointer; flex: none; }
.csw::-webkit-color-swatch-wrapper { padding: 2px; }
.csw::-webkit-color-swatch { border: 0; border-radius: 3px; }
.hex { width: 84px; font-family: Consolas, 'Courier New', monospace; text-transform: lowercase; }
.colorw.isnone .csw { background: repeating-linear-gradient(45deg, #fff 0 4px, #f0d0d0 4px 6px); }
.pal { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.pc { height: 15px; border: 1px solid rgba(0, 0, 0, .14); border-radius: 3px; padding: 0; }
.pc:hover { transform: scale(1.18); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; user-select: none; }
.chk input { margin: 0; accent-color: var(--acc); width: 14px; height: 14px; }
.btns { display: flex; gap: 5px; }
.btns.wrap { flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 27px; border: 1px solid #d3d8e0; background: #fff; border-radius: 5px; padding: 0 10px; font-size: 12.5px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: #f3f5f8; border-color: #c4cad4; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #275fc2; }
.btn.danger { color: var(--danger); }
.btn.primary.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.mini, .mini { height: 22px; padding: 0 7px; font-size: 11.5px; border: 1px solid #d3d8e0; background: #fff; border-radius: 4px; }
.seg { display: inline-flex; border: 1px solid #d3d8e0; border-radius: 5px; overflow: hidden; background: #fff; }
.sg { border: 0; border-right: 1px solid #e3e6eb; background: none; height: 25px; min-width: 30px; padding: 0 9px; font-size: 12.5px; }
.sg:last-child { border-right: 0; }
.sg:hover { background: #f3f5f8; }
.sg.on { background: var(--acc2); color: var(--acc); font-weight: 700; }
.sg.bold { font-weight: 800; }
.sg.ital { font-style: italic; font-family: Georgia, serif; }
.tip { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.tip.warn { color: #9a5b12; background: #fff6e8; border: 1px solid #f3dcb5; border-radius: 6px; padding: 7px 9px; margin: 8px; }
.tipbox { margin: 10px 12px 14px; padding: 9px 11px; border-radius: 7px; background: #f4f7fc; border: 1px solid #e1e8f5; font-size: 11.5px; color: #4a5263; line-height: 1.5; }
.tipbox ul { margin: 4px 0 0; padding-left: 16px; }
.tipbox kbd { font-size: 10px; line-height: 15px; min-width: 15px; }
.sublbl { font-size: 11.5px; font-weight: 600; color: #4a5263; margin-top: 4px; }
.attinfo { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; background: #eefaf3; border: 1px solid #c6ead6; color: #17663f; border-radius: 5px; padding: 3px 4px 3px 8px; width: 100%; }
.attinfo.muted { background: #f5f6f8; border-color: var(--line2); color: var(--muted); padding: 4px 8px; }
.pts { display: flex; flex-direction: column; gap: 4px; }
.ptrow { display: grid; grid-template-columns: 16px 1fr 22px; gap: 4px; align-items: center; }
.ptn { font-size: 10.5px; color: var(--faint); text-align: right; }
.arrtool { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.endpick { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; }
.pininfo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 12px 8px; padding: 6px 6px 6px 10px; background: #f4f7fc; border: 1px solid #e1e8f5; border-radius: 6px; font-size: 12px; color: #3d4a63; }
optgroup { font-weight: 700; color: var(--muted); }

/* ---------- menus ---------- */
.menu { position: fixed; z-index: 50; min-width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(20, 30, 50, .18); padding: 4px; }
.mi { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 5px; }
.mi:hover:not(:disabled) { background: var(--acc2); }
.mic { display: inline-flex; color: var(--muted); justify-content: center; }
.mi.on .mic { color: var(--acc); font-weight: 700; }
.mk { color: var(--faint); font-size: 11.5px; padding-left: 16px; }
.msep { height: 1px; background: var(--line2); margin: 4px 6px; }

/* ---------- dialogs ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(22, 28, 40, .38); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: 470px; max-width: 100%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(10, 20, 40, .3); overflow: hidden; }
.modal.wide { width: 860px; }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line2); }
.mhead b { font-size: 15px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; border-radius: 5px; }
.x:hover { background: #f0f2f5; color: var(--text); }
.mbody { padding: 14px 16px; overflow: auto; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); background: #fafbfc; }
.mfoot .btn { height: 31px; padding: 0 16px; }
.cmsg { margin: 4px 0; font-size: 13.5px; }
.lead { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.help { font-size: 13px; line-height: 1.55; }
.help h3 { font-size: 13.5px; margin: 14px 0 6px; }
.help h3:first-child { margin-top: 6px; }
.help ul, .help ol { margin: 0; padding-left: 20px; }
.help li { margin: 3px 0; }
.help p { margin: 6px 0; }
.htabs { padding: 0; margin-bottom: 4px; position: static; }
.keys { border-collapse: collapse; width: 100%; font-size: 12.5px; }

    welcomeTitle: 'Chào mừng đến với Smart Room Studio', welcomeLead: 'Công cụ vẽ hình minh hoạ 3D, wireframe và sơ đồ — chạy hoàn toàn trên máy, không cần mạng.',
    help_start: `<h3>Màn hình làm việc</h3><ul>
<li><b>Hộp công cụ</b> (bên trái): bấm hoặc kéo khối vào trang. Tab <b>Khối 3D</b> dùng cho trang 3D; tab <b>Hình 2D</b> có chữ, chú thích, sơ đồ, mẫu giao diện app.</li>
<li><b>Thanh trang</b> (trên khung vẽ): mỗi hình là một trang — Hình 2.1a, 2.1b (3D), 2.2, 2.3 (2D). Nhấp đúp tên trang để đổi tên, nút <b>+</b> để thêm trang.</li>
<li><b>Trình khám phá</b> (bên phải, trên): danh sách vật trong trang — ẩn/hiện, khoá, nhấp đúp để đổi tên.</li>
<li><b>Thuộc tính</b> (bên phải, dưới): màu, kích thước, chữ, kiểu nét… của vật đang chọn.</li></ul>
<h3>Dựng hình 3D (2.1a, 2.1b)</h3><ol>
<li>Thêm <b>Phòng (hộp rỗng)</b> làm vỏ mô hình, nhập kích thước (mm) trong Thuộc tính.</li>
<li>Muốn nhìn vào bên trong: đặt tường trước hoặc tường bên thành <b>Mờ</b> hay <b>Ẩn</b>.</li>
<li>Thêm linh kiện (ESP32, breadboard, DHT22, servo, LED…). Dùng <b>Di chuyển</b> (phím 2) để kéo theo trục, <b>Xoay</b> (phím 4) hoặc mục “Mặt trước hướng về” để gắn lên tường.</li>
<li>Nối dây bằng công cụ <b>Nối dây</b> (phím 5) — xem tab “Nối dây”.</li>
<li>Thêm <b>Chú thích</b> hoặc <b>Nhãn ID</b> (tab Hình 2D) rồi kéo chấm tròn của chú thích vào linh kiện.</li></ol>
<h3>Wireframe & sơ đồ (2.2, 2.3)</h3><ul>
<li>Dùng các mẫu trong nhóm <b>Giao diện app</b>: thanh tiêu đề, thẻ, đồng hồ đo, công tắc, thanh trượt, biểu đồ…</li>
<li>Sơ đồ dữ liệu: thêm <b>Khối số thứ tự</b> hoặc <b>Hình chữ nhật</b>, rồi dùng công cụ <b>Nối dây</b>: bấm khối này rồi bấm khối kia để tạo mũi tên.</li>
<li>Nhấp đúp vào hình để gõ chữ.</li></ul>`,
    help_wire: `<h3>Nối dây giữa các chân linh kiện</h3><ol>
<li>Bấm <b>Nối dây</b> trên thanh công cụ (phím <kbd>5</kbd>). Chân linh kiện hiện thành chấm nhỏ: <span class="pk pwr"></span> nguồn, <span class="pk gnd"></span> GND, <span class="pk sig"></span> tín hiệu.</li>
<li>Rê chuột lên chấm để xem tên chân (ví dụ <i>ESP32 · GPIO4</i>), bấm để chọn chân đầu.</li>
<li>Bấm vào chân thứ hai (ví dụ <i>DHT22 · DATA</i>). Dây được tạo, tự vòng và tự lấy màu: chân nguồn = đỏ, GND = đen, tín hiệu = mỗi dây một màu.</li>
<li>Bấm tiếp các cặp chân khác. Bấm <kbd>Esc</kbd> để dừng.</li></ol>
<h3>Biết dây nào nối vào đâu</h3><ul>
<li>Mỗi dây có <b>nhãn ở hai đầu</b> ghi tên chân (GPIO4 … DATA) và có thể <b>đánh số</b> (bật “Hiện số” trong Thuộc tính).</li>
<li>Thêm <b>Bảng nối dây</b> (Hình 2D → Sơ đồ nối dây): bảng tự liệt kê số dây · màu · từ chân nào · đến chân nào, và tự cập nhật khi bạn sửa dây.</li>
<li>Trình khám phá cũng ghi “ESP32 · GPIO4 → DHT22 · DATA” bên cạnh từng dây.</li></ul>
<h3>Sửa dây</h3><ul>
<li>Chọn dây rồi kéo chấm <b>A</b> / <b>B</b> ở đầu dây sang chân khác. Chấm xanh lá = đang gắn vào chân.</li>
<li>Thuộc tính → <b>Đấu nối</b>: chọn linh kiện và chân trong danh sách (breadboard có Hàng A–J và ray nguồn T+ / T− / B+ / B−).</li>
<li><b>Cách đi dây</b>: Vòng cung (tự động), Vuông góc, Thẳng, hoặc Theo điểm tự đặt (kéo các ô vuông để uốn dây).</li>
<li>Di chuyển linh kiện thì dây đi theo.</li>
<li>Linh kiện chưa có sẵn? Dùng <b>Module (chân tuỳ chỉnh)</b> và gõ tên chân, ví dụ “VCC, GND, OUT”.</li></ul>
<h3>Sơ đồ nối dây 2D</h3><p>Dùng <b>Khối chân</b> (gõ tên chân mỗi bên), rồi dùng công cụ Nối dây nối từng chân — dây 2D bám đúng vào chân.</p>`,

    help_save: `<h3>Lưu dự án</h3><ul>
<li><b>Lưu</b> (<kbd>Ctrl</kbd>+<kbd>S</kbd>) tạo tệp <code>.srs.json</code> chứa toàn bộ dự án (mọi trang và ảnh đã chèn). Trên Chrome/Edge bạn chọn được nơi lưu, các lần sau Ctrl+S ghi đè đúng tệp đó.</li>
<li><b>Mở</b> (<kbd>Ctrl</kbd>+<kbd>O</kbd>) hoặc kéo tệp <code>.srs.json</code> thả vào khung vẽ.</li>
<li>Công cụ còn tự lưu tạm trong trình duyệt: mở lại tệp HTML trên cùng máy là thấy bài đang làm.</li></ul>
<h3>Làm chung với bạn</h3><p>Gửi tệp <code>.srs.json</code> cho nhau (Zalo, Messenger, Drive…). Người nhận mở <b>SmartRoomStudio.html</b>, bấm <b>Mở…</b> và chọn tệp đó.</p>
<h3>Đưa hình vào báo cáo</h3><ul>
<li><b>Xuất ảnh</b> (<kbd>Ctrl</kbd>+<kbd>E</kbd>): PNG 2× hoặc 3× để chèn vào Word; chọn “Sát nội dung” để cắt bỏ khoảng trắng thừa.</li>
<li>Chọn “Tất cả” để xuất mọi trang một lần (mỗi trang một tệp).</li></ul>`,

    welcomeTitle: 'Welcome to Smart Room Studio', welcomeLead: 'A tool for 3D product drawings, wireframes and diagrams — runs entirely on your computer, no internet needed.',
    help_start: `<h3>The workspace</h3><ul>
<li><b>Toolbox</b> (left): click or drag parts onto the page. The <b>3D parts</b> tab is for 3D pages; the <b>2D shapes</b> tab has text, callouts, diagrams and app mock-ups.</li>
<li><b>Page bar</b> (above the canvas): each figure is a page — Figure 2.1a, 2.1b (3D), 2.2, 2.3 (2D). Double-click a page name to rename it; <b>+</b> adds a page.</li>
<li><b>Explorer</b> (top right): everything on the page — show/hide, lock, double-click to rename.</li>
<li><b>Properties</b> (bottom right): colours, sizes, text and line styles of the selection.</li></ul>
<h3>Building a 3D drawing (2.1a, 2.1b)</h3><ol>
<li>Add a <b>Room (hollow box)</b> as the enclosure and type its size (mm) in Properties.</li>
<li>To see inside, set the front or a side wall to <b>Ghost</b> or <b>Hidden</b>.</li>
<li>Add parts (ESP32, breadboard, DHT22, servo, LED…). Use <b>Move</b> (key 2) to drag along an axis, <b>Rotate</b> (key 4) or “Front faces” to mount parts on walls.</li>
<li>Connect them with the <b>Wire</b> tool (key 5) — see the Wiring tab.</li>
<li>Add a <b>Callout</b> or <b>ID badge</b> (2D shapes tab) and drag the callout’s round handle onto a part.</li></ol>
<h3>Wireframes & diagrams (2.2, 2.3)</h3><ul>
<li>Use the <b>App UI</b> pieces: app bar, card, gauge, switch, slider, chart…</li>
<li>Data-flow diagrams: add <b>Numbered nodes</b> or <b>Rectangles</b>, then use the <b>Wire</b> tool: click one shape, then another, to draw an arrow.</li>
<li>Double-click a shape to type in it.</li></ul>`,
    help_wire: `<h3>Wiring part pins together</h3><ol>
<li>Click <b>Wire</b> in the toolbar (key <kbd>5</kbd>). Part pins show as small dots: <span class="pk pwr"></span> power, <span class="pk gnd"></span> GND, <span class="pk sig"></span> signal.</li>
<li>Hover a dot to see its name (e.g. <i>ESP32 · GPIO4</i>) and click it to start.</li>
<li>Click the second pin (e.g. <i>DHT22 · DATA</i>). The wire is created, routed and coloured automatically: power = red, GND = black, signals get different colours.</li>
<li>Keep clicking pairs of pins. Press <kbd>Esc</kbd> to stop.</li></ol>
<h3>Knowing which wire goes where</h3><ul>
<li>Each wire has <b>labels at both ends</b> with the pin names (GPIO4 … DATA) and can be <b>numbered</b> (turn on “Show number” in Properties).</li>
<li>Add a <b>Wiring table</b> (2D shapes → Wiring diagram): it lists wire no. · colour · from pin · to pin, and updates as you edit the wires.</li>
<li>The Explorer also shows “ESP32 · GPIO4 → DHT22 · DATA” next to each wire.</li></ul>
<h3>Editing wires</h3><ul>
<li>Select a wire and drag its <b>A</b> / <b>B</b> dot to another pin. A green dot means it is attached.</li>
<li>Properties → <b>Connections</b>: pick the part and pin from a list (the breadboard has rows A–J and power rails T+ / T− / B+ / B−).</li>
<li><b>Routing</b>: Arc (automatic), Right angles, Straight, or Through my points (drag the squares to bend the wire).</li>
<li>Move a part and its wires follow.</li>
<li>Part not in the toolbox? Use <b>Module (custom pins)</b> and type its pin names, e.g. “VCC, GND, OUT”.</li></ul>
<h3>2D wiring diagrams</h3><p>Use a <b>Pin block</b> (type the pin names for each side), then wire pin to pin with the Wire tool — 2D wires snap to the exact pin.</p>`,

    help_save: `<h3>Saving</h3><ul>
<li><b>Save</b> (<kbd>Ctrl</kbd>+<kbd>S</kbd>) creates a <code>.srs.json</code> file holding the whole project (all pages and inserted images). In Chrome/Edge you choose where to save it, and later Ctrl+S overwrites that same file.</li>
<li><b>Open</b> (<kbd>Ctrl</kbd>+<kbd>O</kbd>) or drop a <code>.srs.json</code> file onto the canvas.</li>
<li>Your work is also kept in the browser: reopen the HTML file on the same computer to continue.</li></ul>

      const pg = { cam: { yaw: 135, pitch: 35.264, scale: 1, ox: 0, oy: 0 } };
      const b = bb2(boxCorners(a).map(p => P2(camOf(pg), p)));
      const s = Math.min(40 / Math.max(0.01, b.x1 - b.x0), 32 / Math.max(0.01, b.y1 - b.y0));
      pg.cam = { yaw: 135, pitch: 35.264, scale: s, ox: 24 - s * (b.x0 + b.x1) / 2, oy: 20 - s * (b.y0 + b.y1) / 2 };
      const r = renderObjects([o], camOf(pg), 0.3);
      svg = `<svg viewBox="0 0 48 40" width="48" height="40" aria-hidden="true">${r.svg.replace(/stroke-width="([\d.]+)"/g, (m, w) => `stroke-width="${N(Math.min(+w, 1.6) * 0.6)}"`).replace(/ data-(oid|f)="[^"]*"/g, '')}</svg>`;

      const ctx = { pg: { items: [it] }, B: null, item: () => null, obj: () => null, asset: () => null, t };
      const inner = W.render(it, ctx);
      let bx = it.x, by = it.y, bw = it.w, bh = it.h;
      if (it.type === 'line') { bx = -6; by = -6; bw = 132; bh = it.props.route === 'elbow' ? 72 : 42; }

}

function rbtn(id, ic, label, fn, o = {}) {

    class: 'rb' + (o.big ? ' big' : '') + (o.label ? ' lab' : '') + (o.cls ? ' ' + o.cls : ''), id: id ? 'rb-' + id : null, type: 'button',

}
const rgroup = (label, ...kids) => h('div', { class: 'rg' }, h('div', { class: 'rgb' }, ...kids), h('div', { class: 'rgl' }, label));
function camStep(dy, dp) { const c = page().cam; setCamAngles(c.yaw + dy, c.pitch + dp); }

function updToolbar() {
  const pg = page();
  if (!pg) return;
  const is3 = pg.kind === '3d';
  if (!is3 && (S.tool === 'scale' || S.tool === 'rotate')) { S.tool = 'select'; if (SVG) SVG.dataset.tool = 'select'; }
  for (const tl of ['select', 'move', 'scale', 'rotate', 'wire', 'pan']) { const b = $('#rb-' + tl); if (b) { b.classList.toggle('on', S.tool === tl); b.setAttribute('aria-pressed', S.tool === tl ? 'true' : 'false'); } }
  const tg = (id, on) => { const b = $('#rb-' + id); if (b) { b.classList.toggle('on', !!on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); } };
  tg('grid', S.set.grid); tg('snap', S.set.snap); tg('pins', S.set.pins);
  for (const id of ['camL', 'camR', 'camU', 'camD', 'iso', 'fitScene', 'scale', 'rotate', 'pins', 'drop']) { const b = $('#rb-' + id); if (b) b.disabled = !is3; }
}
function updTop() {
  const u = $('#rb-undo'), r = $('#rb-redo');

  if (r) r.disabled = !(S.hi < S.hist.length - 1);

  if (d) { d.textContent = dirty ? t('unsaved') : t('allSaved'); d.classList.toggle('on', dirty); }
  const nm = $('#projName');

  if (S.proj) document.title = `${S.proj.name}${dirty ? ' •' : ''} — Smart Room Studio`;
}
function toolHint() {
  const is3 = page().kind === '3d';
  switch (S.tool) {
    case 'move': return t(is3 ? 'hMove3d' : 'hMove2d');
    case 'scale': return t('hScale');
    case 'rotate': return t('hRotate');
    case 'wire': return t('wireStep1');
    case 'pan': return t('hPan');
    default: return t(is3 ? 'hSelect3d' : 'hSelect2d');
  }
}
function updStatus() {
  const pg = page();
  if (!pg) return;
  const msg = $('#stMsg'), co = $('#stCoord'), se = $('#stSel'), sz = $('#stSize'), zp = $('#zoomPct');
  if (msg) msg.textContent = S.status || toolHint();
  if (co) {
    let s = '';
    if (S.cursor) {
      if (pg.kind === '3d') { const w = unproj(camOf(pg), S.cursor.x, S.cursor.y, [0, 0, 1], [0, 0, 0]); if (w && Math.abs(w[0]) < 1e5 && Math.abs(w[1]) < 1e5) s = `${t('floorAt')}  X ${r1(w[0])}   Y ${r1(w[1])} mm`; }
      else s = `X ${Math.round(S.cursor.x)}   Y ${Math.round(S.cursor.y)} px`;
    }
    co.textContent = s;
  }
  if (se) se.textContent = S.sel.length ? t('nSelected', S.sel.length) : '';
  if (sz) sz.textContent = `${pg.kind.toUpperCase()} · ${pg.w} × ${pg.h}`;
  if (zp) zp.textContent = Math.round(view().zoom * 100) + '%';
}
function refreshAll() {
  if (S.edit) finishEdit(true);
  buildPages();
  syncLibTab();
  buildLayers();
  buildProps();
  updToolbar();

// ---------- i18n of static markup ----------
function applyI18n() {
  document.documentElement.lang = S.set.lang;
  for (const el of $$('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of $$('[data-i18n-title]')) { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); }
  for (const el of $$('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);

function setLang(l) {
  if (!I18N[l]) return;
  S.set.lang = l;
  saveSettings();
  for (const k in THUMBS) delete THUMBS[k];

// ---------- files ----------
function markSaved() { SAVED = snapStr(); updTop(); }
async function saveProject(as) {
  if (S.edit) finishEdit(true);
  const json = JSON.stringify(S.proj), name = slug(S.proj.name) + '.srs.json';
  if (window.showSaveFilePicker) {
    try {
      if (!FILE_HANDLE || as) FILE_HANDLE = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Smart Room Studio (.srs.json)', accept: { 'application/json': ['.json'] } }] });
      const w = await FILE_HANDLE.createWritable();
      await w.write(new Blob([json], { type: 'application/json' }));
      await w.close();
      markSaved();
      toast(t('savedTo', FILE_HANDLE.name), 'ok');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      FILE_HANDLE = null;
    }
  }
  download(name, new Blob([json], { type: 'application/json' }));
  markSaved();
  toast(t('savedDl', name), 'ok');
}
function loadProject(p) {
  if (S.edit) finishEdit(false);
  S.proj = p;
  S.pid = p.pages[0].id;
  S.sel = []; S.views = {}; S.wdraft = null; S.drag = null;
  resetHistory();
  markSaved();
  refreshAll();
  requestAnimationFrame(() => fitView());
  autosaveSoon();
}
function openProjectFile(f) {
  return f.text().then(txt => {
    let p;
    try { p = migrate(JSON.parse(txt)); } catch (e) { toast(t('badProject'), 'err'); return false; }
    const go = () => { loadProject(p); toast(t('opened', f.name), 'ok'); };
    if (isDirty()) confirmBox(t('replaceConfirm'), go, t('open'));
    else go();
    return true;
  }, () => { toast(t('badProject'), 'err'); return false; });
}
async function openProject() {
  if (window.showOpenFilePicker) {
    try {
      const [hd] = await window.showOpenFilePicker({ types: [{ description: 'Smart Room Studio (.srs.json)', accept: { 'application/json': ['.json'] } }] });
      const f = await hd.getFile();
      if (await openProjectFile(f)) FILE_HANDLE = hd;
      return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const inp = h('input', { type: 'file', accept: '.json,application/json' });
  inp.addEventListener('change', () => { if (inp.files[0]) openProjectFile(inp.files[0]).then(ok => { if (ok) FILE_HANDLE = null; }); });
  inp.click();
}
function newProjectCmd() {
  const go = () => { FILE_HANDLE = null; loadProject(newProject()); };
  if (isDirty()) confirmBox(t('newConfirm'), go, t('newProject'));
  else go();
}
function insertImage() {
  const inp = h('input', { type: 'file', accept: 'image/*' });
  inp.addEventListener('change', () => { const f = inp.files[0]; if (f) readImageFile(f, (url, w, h2) => addImageItem(url, null, w, h2)); });
  inp.click();
}
function renamePageCmd() {
  const nm = $('#pages .pgrow.on .pname');
  if (!nm) return;
  const pg = page();
  renameInline(nm, pg.name, v => { pg.name = v; commit(); buildPages(); buildProps(); });
}

// ---------- export ----------
function contentBox(inner) {
  const m = $('#measure');
  if (!m) return null;
  m.innerHTML = `<g>${inner}</g>`;
  let b = null;
  try {
    const bb = m.firstChild.getBBox();
    if (bb.width > 0 && bb.height > 0) b = { x: Math.floor(bb.x - 16), y: Math.floor(bb.y - 16), w: Math.ceil(bb.width + 32), h: Math.ceil(bb.height + 32) };
  } catch (e) { b = null; }
  m.innerHTML = '';
  return b;
}
function exportSVG(pg, o) {
  const r = renderPage(pg, { exp: true, grid: pg.kind === '3d' && !!o.grid });
  let box = { x: 0, y: 0, w: pg.w, h: pg.h };
  if (o.crop === 'fit') { const b = contentBox(r.svg); if (b) box = b; }
  const sc = o.fmt === 'png' ? Math.min(+o.scale || 1, 16000 / Math.max(box.w, box.h)) : 1;
  const W = Math.max(1, Math.round(box.w * sc)), H = Math.max(1, Math.round(box.h * sc));
  const bg = o.transparent ? '' : `<rect x="${N(box.x)}" y="${N(box.y)}" width="${N(box.w)}" height="${N(box.h)}" fill="${pg.bg || '#ffffff'}"/>`;
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="${N(box.x)} ${N(box.y)} ${N(box.w)} ${N(box.h)}">${bg}${r.svg}</svg>`, W, H };
}
function svgToPng(svg, W, H) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        c.getContext('2d').drawImage(img, 0, 0, W, H);
        c.toBlob(b => (b ? res(b) : rej(new Error('toBlob'))), 'image/png');
      } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error('image'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function doExport(o) {
  const pages = o.which === 'all' ? S.proj.pages : [page()];
  let n = 0;
  for (const pg of pages) {
    const { svg, W, H } = exportSVG(pg, o);
    const base = slug(pg.name);
    if (o.fmt === 'svg') download(base + '.svg', new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg], { type: 'image/svg+xml' }));
    else {
      try { download(base + '.png', await svgToPng(svg, W, H)); } catch (e) { console.warn(e); toast(t('exportFail'), 'err'); return; }
    }
    n++;
    if (pages.length > 1) await new Promise(r => setTimeout(r, 400));
  }
  toast(t('exported', n), 'ok');
}
function showExport() {
  if (S.edit) finishEdit(true);
  let st = {};
  try { st = JSON.parse(LS.get('srs.export') || '{}') || {}; } catch (e) { st = {}; }
  const o = Object.assign({ fmt: 'png', scale: 2, crop: 'page', transparent: false, which: 'cur', grid: false }, st);
  const pg = page();
  const info = h('div', { class: 'xinfo' });
  const prev = h('img', { class: 'xprev', alt: '' });
  const upd = () => {
    const r = exportSVG(pg, o);
    info.textContent = o.fmt === 'png' ? `${r.W} × ${r.H} px` : `SVG · ${pg.w} × ${pg.h}`;
    prev.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg);
  };
  const segO = (key, opts) => {
    const box = h('div', { class: 'seg' });
    const bs = opts.map(([v, label]) => {
      const b = h('button', { class: 'sg', type: 'button' }, label);
      b.addEventListener('click', () => { o[key] = v; bs.forEach(([vv, bb]) => bb.classList.toggle('on', vv === o[key])); body.classList.toggle('isvg', o.fmt === 'svg'); upd(); });
      box.append(b);
      return [v, b];
    });
    bs.forEach(([v, b]) => b.classList.toggle('on', v === o[key]));
    return box;
  };
  const gridChk = h('input', { type: 'checkbox' });
  gridChk.checked = !!o.grid;
  gridChk.addEventListener('change', () => { o.grid = gridChk.checked; upd(); });
  const body = h('div', { class: 'xbody' + (o.fmt === 'svg' ? ' isvg' : '') },
    h('div', { class: 'xopts' },
      row(t('xFormat'), segO('fmt', [['png', 'PNG'], ['svg', 'SVG']])),
      h('div', { class: 'pngonly' }, row(t('xScale'), segO('scale', [[1, '1×'], [2, '2×'], [3, '3×'], [4, '4×']]))),
      row(t('xArea'), segO('crop', [['page', t('xWholePage')], ['fit', t('xFit')]])),
      row(t('xBg'), segO('transparent', [[false, t('xPageColor')], [true, t('xTransparent')]])),
      row(t('xPages'), segO('which', [['cur', t('xCurrent')], ['all', t('xAll')]])),
      pg.kind === '3d' || S.proj.pages.some(p => p.kind === '3d') ? row('', h('label', { class: 'chk' }, gridChk, h('span', {}, t('xGrid')))) : null,
      h('p', { class: 'tip' }, t('xTip'))),
    h('div', { class: 'xright' }, h('div', { class: 'xprevbox' }, prev), info));
  upd();
  modal(t('exportTitle'), body, [
    { label: t('cancel') },
    { label: t('exportGo'), cls: 'primary', fn: () => { LS.set('srs.export', JSON.stringify(o)); doExport(o); } },
  ], { wide: true });
}

// ---------- help ----------
function showHelp(welcome, tab) {
  const tabs = [['start', t('hTabStart')], ['wire', t('hTabWire')], ['keys', t('hTabKeys')], ['save', t('hTabSave')]];
  let cur = tab || 'start';
  const content = h('div', { class: 'help' });
  const bar = h('div', { class: 'tabs htabs' });
  const draw = () => {
    bar.innerHTML = '';
    for (const [k, label] of tabs) bar.append(h('button', { class: 'tab' + (k === cur ? ' on' : ''), type: 'button', onclick: () => { cur = k; draw(); } }, label));
    content.innerHTML = t('help_' + cur);
  };
  draw();
  modal(welcome ? t('welcomeTitle') : t('quickGuide'), h('div', {}, welcome ? h('p', { class: 'lead' }, t('welcomeLead')) : null, bar, content), [{ label: t('gotIt'), cls: 'primary' }], { wide: true });
}
function showAbout() {
  modal(t('about'), h('div', { class: 'help', html: t('aboutHtml') }), [{ label: t('ok'), cls: 'primary' }]);
}

// ---------- layout bits ----------
function bindSplit() {
  const sp = $('#split'), ex = $('#explorerPanel');
  if (!sp || !ex) return;
  const saved = LS.get('srs.split');
  if (saved && /^\d+$/.test(saved)) ex.style.flex = `0 0 ${saved}px`;
  let d = null;
  sp.addEventListener('pointerdown', e => { d = { y: e.clientY, h: ex.getBoundingClientRect().height }; sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); });
  sp.addEventListener('pointermove', e => { if (!d) return; ex.style.flex = `0 0 ${Math.round(clamp(d.h + e.clientY - d.y, 90, window.innerHeight - 300))}px`; });
  const end = () => { if (!d) return; d = null; sp.classList.remove('drag'); LS.set('srs.split', String(Math.round(ex.getBoundingClientRect().height))); };
  sp.addEventListener('pointerup', end);
  sp.addEventListener('pointercancel', end);
}
function bindUI() {
  for (const b of $$('[data-menu]')) b.addEventListener('click', () => openMenu(b, menuItems(b.dataset.menu)));
  for (const b of $$('[data-menu]')) b.addEventListener('pointerenter', () => { if (MENU && !b.classList.contains('open')) openMenu(b, menuItems(b.dataset.menu)); });
  document.addEventListener('pointerdown', e => { if (MENU && !MENU.contains(e.target) && !(MENU_ANCHOR && MENU_ANCHOR.contains(e.target)) && !e.target.closest('[data-menu]')) closeMenus(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && MENU) { closeMenus(); e.stopPropagation(); }
    if (e.key === 'F1') { e.preventDefault(); showHelp(); }
  }, true);
  const nm = $('#projName');
  nm.addEventListener('change', () => { S.proj.name = nm.value.trim() || t('defaultProject'); commit(); updTop(); });
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') nm.blur(); e.stopPropagation(); });
  $('#langBtn').addEventListener('click', () => setLang(S.set.lang === 'vi' ? 'en' : 'vi'));
  $('#helpBtn').addEventListener('click', () => showHelp());
  $('#saveBtn').addEventListener('click', () => saveProject());
  $('#exportBtn').addEventListener('click', showExport);
  $('#addPageBtn').addEventListener('click', e => openMenu(e.currentTarget, [
    { label: t('new3dPage'), icon: 'cube', fn: () => addPage('3d') },
    { label: t('new2dPage'), icon: 'square', fn: () => addPage('2d') },
  ]));
  $('#pageMenuBtn').addEventListener('click', e => openMenu(e.currentTarget, menuItems('page')));
  bindSplit();
  window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', debounce(() => { closeMenus(); if (view().fit) fitView(); else render(); }, 120));
}

// ---------- start ----------
function init() {
  loadSettings();
  SVG = $('#canvas'); VP = $('#vp'); UNDER = $('#under'); CONTENT = $('#content'); OVER = $('#over'); AB = $('#ab'); ABS = $('#abs');
  let p = null;
  const raw = LS.get('srs.autosave');
  if (raw) { try { p = migrate(JSON.parse(raw)); } catch (e) { p = null; } }
  const restored = !!p && p.pages.some(pg => pg.items.length || (pg.objects || []).length);
  S.proj = restored ? p : newProject();
  S.pid = S.proj.pages[0].id;
  applyI18n();
  buildRibbon();
  buildLib();
  bindCanvas();
  bindUI();
  resetHistory();
  SAVED = restored ? null : snapStr();
  SVG.dataset.tool = S.tool;
  refreshAll();
  requestAnimationFrame(() => fitView());
  if (restored) toast(t('restored'), 'ok');
  if (!LS.get('srs.welcomed')) { LS.set('srs.welcomed', '1'); setTimeout(() => showHelp(true), 250); }
  window.SRS = {
    S, t, page, render, addEntry, LIBALL, setTool, makeWireBetween, wireTarget3D, exportSVG, partPins, setLang, loadProject, migrate,
    findObj, findItem, setSel, fitScene, fitView, commit, camPreset, switchPage, makeObj, makeItem, renderPage, refreshAll, undo, redo, view,
    objSolids, prepSolid, frontOf, sortSolids, camOf,
  };
}
init();
